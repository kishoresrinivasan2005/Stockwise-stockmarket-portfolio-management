{% extends "base.html" %}
{% block title %}Edit Stock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-primary"><i class="fas fa-edit me-2"></i>Edit Stock: {{ item.stock_symbol }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('portfolio.edit', portfolio_id=item.portfolio_id) }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Symbol</label>
                            <input type="text" class="form-control bg-light" value="{{ item.stock_symbol }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-control bg-light" value="{{ item.company_name }}" disabled>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" min="1" step="1" value="{{ item.quantity }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="buy_price" class="form-label">Purchase Price ($)</label>
                            <input type="number" class="form-control" id="buy_price" name="buy_price" min="0.01" step="0.01" value="{{ item.buy_price }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="buy_date" class="form-label">Purchase Date</label>
                        <input type="date" class="form-control" id="buy_date" name="buy_date" value="{{ item.buy_date.strftime('%Y-%m-%d') if item.buy_date else '' }}" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('portfolio.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary custom-btn">Update Stock</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
