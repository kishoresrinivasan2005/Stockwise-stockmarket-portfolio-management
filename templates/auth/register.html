{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
            <div class="card-header auth-header text-white text-center py-4 rounded-top">
                <h3 class="font-weight-light my-2">Create Account</h3>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputName" type="text" name="name" placeholder="John Doe" required />
                        <label for="inputName">Full Name</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputEmail" type="email" name="email" placeholder="name@example.com" required />
                        <label for="inputEmail">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputPassword" type="password" name="password" placeholder="Password" required />
                        <label for="inputPassword">Password</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputConfirmPassword" type="password" name="confirm_password" placeholder="Confirm Password" required />
                        <label for="inputConfirmPassword">Confirm Password</label>
                    </div>
                    <div class="d-grid gap-2 mt-4 mb-0">
                        <button class="btn btn-primary btn-lg custom-btn" type="submit">Create Account</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <div class="small"><a href="{{ url_for('auth.login') }}">Have an account? Go to login</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
